<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-assets>
        <!-- Nome exato do seu arquivo de imagem PNG -->
        <img id="logo" src="sua-logo.png">
      </a-assets>

      <!-- Nome exato do seu arquivo .patt -->
      <a-marker type="pattern" url="pattern-WhatsApp Image 2026-09-22 at 11.00.25.patt">
        <a-image 
          src="#logo" 
          position="0 0 0" 
          rotation="-90 0 0" 
          width="2" 
          height="1">
        </a-image>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
