<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Invisível - Anúncios AR</title>
  
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: white; overflow: hidden; }
    .screen { display: none; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    .active { display: flex; flex-direction: column; }
    
    /* Home */
    #home-screen { align-items: center; justify-content: center; gap: 15px; text-align: center; padding: 20px; }
    .btn { background: #2563eb; color: white; border: none; padding: 16px 24px; border-radius: 12px; font-size: 16px; font-weight: bold; width: 85%; max-width: 320px; cursor: pointer; }
    .btn-secondary { background: #334155; }
    .btn-world { background: #059669; }

    /* Painel de Edição AR */
    .ar-controls { 
      position: fixed; bottom: 0; left: 0; width: 100%; 
      background: rgba(15, 23, 42, 0.95); padding: 12px; 
      box-sizing: border-box; display: flex; flex-direction: column; 
      gap: 8px; z-index: 999; border-top-left-radius: 20px; border-top-right-radius: 20px; 
    }
    .input-field { padding: 8px 12px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: white; font-size: 14px; }
    .coords-info { font-family: monospace; font-size: 12px; color: #38bdf8; text-align: center; background: #0284c722; padding: 6px; border-radius: 6px; }
    .controls-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .btn-sm { padding: 8px; font-size: 12px; border-radius: 6px; border: none; background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; }

    /* Lista de QR Codes */
    #list-screen { padding: 20px; overflow-y: auto; box-sizing: border-box; }
    .ad-card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; border: 1px solid #334155; }
    .qr-container { background: white; padding: 10px; border-radius: 8px; }

    /* Botão Flutuante Voltar no Modo Mundo */
    .btn-back-world { position: fixed; top: 15px; left: 15px; z-index: 999; background: rgba(0,0,0,0.6); color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <!-- TELA 1: HOME -->
  <div id="home-screen" class="screen active">
    <h1>MAPA INVISÍVEL</h1>
    <p>Plataforma de Anúncios em AR</p>
    <button class="btn" onclick="showScreen('cadastrar-screen');">1. Cadastrar Anúncio</button>
    <button class="btn btn-secondary" onclick="showScreen('list-screen'); loadAds();">2. Ver Anúncios & QR Codes</button>
    <button class="btn btn-world" onclick="openWorldMode();">3. Abrir Modo MUNDO (Câmera)</button>
  </div>

  <!-- TELA 2: CADASTRAR (PAINEL DE EDIÇÃO) -->
  <div id="cadastrar-screen" class="screen">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
      <a-entity camera></a-entity>
      <a-plane id="ar-image" position="0 1.5 -2" rotation="0 0 0" width="1" height="0.6" visible="false" material="shader: flat; side: double; transparent: true"></a-plane>
    </a-scene>

    <div class="ar-controls">
      <input type="text" id="ad-name" class="input-field" placeholder="Nome do Anúncio (ex: Fachada Loja)">
      <input type="file" id="image-input" accept="image/*" class="input-field" onchange="handleImageUpload(event)">
      
      <div class="coords-info" id="coords-display">
        Coordenadas: X: 0.00 | Y: 1.50 | Z: -2.00
      </div>

      <div class="controls-grid">
        <button class="btn-sm" onclick="adjustPosition('x', -0.2)">← Esquerda</button>
        <button class="btn-sm" onclick="adjustPosition('y', 0.2)">↑ Subir</button>
        <button class="btn-sm" onclick="adjustPosition('x', 0.2)">→ Direita</button>
        
        <button class="btn-sm" onclick="adjustPosition('z', -0.2)">Afastar (-Z)</button>
        <button class="btn-sm" onclick="adjustPosition('y', -0.2)">↓ Descerca</button>
        <button class="btn-sm" onclick="adjustPosition('z', 0.2)">Aproximar (+Z)</button>
      </div>

      <div class="controls-grid" style="grid-template-columns: 1fr 1fr;">
        <button class="btn-sm" onclick="adjustScale(0.1)">+ Tamanho</button>
        <button class="btn-sm" onclick="adjustScale(-0.1)">- Tamanho</button>
      </div>

      <div style="display: flex; gap: 8px; margin-top: 4px;">
        <button class="btn" style="width: 70%; padding: 10px; font-size: 14px;" onclick="saveAd()">Salvar Anúncio (JSON)</button>
        <button class="btn btn-secondary" style="width: 30%; padding: 10px; font-size: 14px;" onclick="showScreen('home-screen');">Voltar</button>
      </div>
    </div>
  </div>

  <!-- TELA 3: TELA PÚBLICA "MUNDO" (LEITOR DO QR CODE) -->
  <div id="world-screen" class="screen">
    <button class="btn-back-world" onclick="showScreen('home-screen');">← Menu</button>
    <a-scene id="world-scene" embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
      <a-entity camera></a-entity>
      <a-plane id="world-ar-image" position="0 1.5 -2" rotation="0 0 0" width="1" height="0.6" visible="false" material="shader: flat; side: double; transparent: true"></a-plane>
    </a-scene>
  </div>

  <!-- TELA 4: PAINEL DE QR CODES -->
  <div id="list-screen" class="screen">
    <h2 style="text-align: center;">Anúncios & QR Codes</h2>
    <div id="ads-container"></div>
    <button class="btn btn-secondary" style="margin: 20px auto; display: block;" onclick="showScreen('home-screen');">Voltar ao Menu</button>
  </div>

  <script>
    let currentCoords = { x: 0, y: 1.5, z: -2.0 };
    let currentScale = { width: 1, height: 0.6 };
    let currentImageData = "";

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentImageData = e.target.result;
          const plane = document.getElementById('ar-image');
          plane.setAttribute('src', currentImageData);
          plane.setAttribute('position', `${currentCoords.x} ${currentCoords.y} ${currentCoords.z}`);
          plane.setAttribute('visible', 'true');
          updateCoordsDisplay();
        };
        reader.readAsDataURL(file);
      }
    }

    function adjustPosition(axis, delta) {
      currentCoords[axis] = parseFloat((currentCoords[axis] + delta).toFixed(2));
      const plane = document.getElementById('ar-image');
      plane.setAttribute('position', `${currentCoords.x} ${currentCoords.y} ${currentCoords.z}`);
      updateCoordsDisplay();
    }

    function adjustScale(delta) {
      currentScale.width = Math.max(0.2, parseFloat((currentScale.width + delta).toFixed(2)));
      currentScale.height = Math.max(0.2, parseFloat((currentScale.height + delta).toFixed(2)));
      const plane = document.getElementById('ar-image');
      plane.setAttribute('width', currentScale.width);
      plane.setAttribute('height', currentScale.height);
    }

    function updateCoordsDisplay() {
      document.getElementById('coords-display').innerText = 
        `Coordenadas: X: ${currentCoords.x} | Y: ${currentCoords.y} | Z: ${currentCoords.z}`;
    }

    function saveAd() {
      const name = document.getElementById('ad-name').value;
      if (!name) return alert("Por favor, digite o nome do anúncio!");
      if (!currentImageData) return alert("Por favor, selecione uma imagem!");

      const newAd = {
        id: Date.now(),
        name: name,
        image: currentImageData,
        coords: currentCoords,
        scale: currentScale
      };

      let ads = JSON.parse(localStorage.getItem('mapa_invisivel_ads') || '[]');
      ads.push(newAd);
      localStorage.setItem('mapa_invisivel_ads', JSON.stringify(ads));

      alert("Anúncio salvo!");
      showScreen('home-screen');
    }

    function loadAds() {
      const container = document.getElementById('ads-container');
      container.innerHTML = "";
      let ads = JSON.parse(localStorage.getItem('mapa_invisivel_ads') || '[]');

      if (ads.length === 0) {
        container.innerHTML = "<p style='text-align:center;'>Nenhum anúncio cadastrado ainda.</p>";
        return;
      }

      ads.forEach(ad => {
        const card = document.createElement('div');
        card.className = 'ad-card';
        card.innerHTML = `
          <h3>${ad.name}</h3>
          <p style="font-size: 12px; font-family: monospace; color: #38bdf8;">
            Posição: X:${ad.coords.x} | Y:${ad.coords.y} | Z:${ad.coords.z}
          </p>
          <div class="qr-container" id="qr-${ad.id}"></div>
        `;
        container.appendChild(card);

        // O QR Code gera o link DIRETO para a aba "Mundo" com os dados do anúncio na URL
        const baseUrl = window.location.href.split('?')[0];
        const worldUrl = `${baseUrl}?mode=world&id=${ad.id}&x=${ad.coords.x}&y=${ad.coords.y}&z=${ad.coords.z}&w=${ad.scale.width}&h=${ad.scale.height}`;
        
        new QRCode(document.getElementById(`qr-${ad.id}`), {
          text: worldUrl,
          width: 140,
          height: 140
        });
      });
    }

    // Abre o modo Mundo (leitor limpo)
    function openWorldMode(adData = null) {
      showScreen('world-screen');
      const plane = document.getElementById('world-ar-image');
      
      if (adData) {
        plane.setAttribute('src', adData.image);
        plane.setAttribute('position', `${adData.coords.x} ${adData.coords.y} ${adData.coords.z}`);
        plane.setAttribute('width', adData.scale.width);
        plane.setAttribute('height', adData.scale.height);
        plane.setAttribute('visible', 'true');
      }
    }

    // VERIFICA SE A PÁGINA FOI ABERTA POR UM QR CODE NA RUA
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const mode = urlParams.get('mode');
      const adId = urlParams.get('id');

      if (mode === 'world' && adId) {
        let ads = JSON.parse(localStorage.getItem('mapa_invisivel_ads') || '[]');
        let ad = ads.find(a => a.id == adId);

        if (ad) {
          openWorldMode(ad);
        } else {
          // Se for acessado em outro dispositivo, lê as coordenadas da própria URL
          const urlAd = {
            image: "https://via.placeholder.com/300x200.png?text=Anuncio+AR",
            coords: { x: urlParams.get('x') || 0, y: urlParams.get('y') || 1.5, z: urlParams.get('z') || -2 },
            scale: { width: urlParams.get('w') || 1, height: urlParams.get('h') || 0.6 }
          };
          openWorldMode(urlAd);
        }
      }
    };
  </script>
</body>
</html>
