<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Anúncios AR - Marcador</title>

  <!-- Bibliotecas para AR.js e A-Frame (compatíveis com celulares sem ARCore) -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <!-- Biblioteca para gerar QR Codes automaticamente -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }
    h1, h2 { text-align: center; }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-secondary { background: #5856d6; }
    .btn-danger { background: #ff3b30; }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0 16px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
    }
    .qr-container {
      display: flex;
      justify-content: center;
      margin: 10px 0;
    }
    #arView {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 999;
      display: none;
    }
    .close-ar {
      position: absolute;
      top: 20px; right: 20px;
      z-index: 1000;
      background: rgba(0,0,0,0.7);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <div id="uiContainer" class="container">
    <!-- TELA 1: MENU PRINCIPAL -->
    <div id="screenMenu">
      <h1>Anúncios Virtuais AR</h1>
      <button class="btn" onclick="showScreen('screenCadastro')">1. Cadastrar Novo Anúncio</button>
      <button class="btn btn-secondary" onclick="showScreen('screenLista')">2. Ver Anúncios Cadastrados (QR Codes)</button>
    </div>

    <!-- TELA 2: FORMULÁRIO DE CADASTRO -->
    <div id="screenCadastro" style="display: none;">
      <h2>Cadastrar Anúncio</h2>
      <label>Nome do Anúncio/Estabelecimento:</label>
      <input type="text" id="adName" placeholder="Ex: Anúncio Padaria">

      <label>URL da Imagem do Anúncio (PNG/JPG):</label>
      <input type="url" id="adImageUrl" placeholder="https://exemplo.com/imagem.png">

      <label>Largura do Banner (metros):</label>
      <input type="number" id="adWidth" value="2" step="0.1">

      <label>Altura do Banner (metros):</label>
      <input type="number" id="adHeight" value="1" step="0.1">

      <button class="btn" onclick="salvarAnuncio()">Salvar Anúncio</button>
      <button class="btn btn-danger" onclick="showScreen('screenMenu')">Voltar</button>
    </div>

    <!-- TELA 3: LISTA DE ANÚNCIOS COM QR CODE -->
    <div id="screenLista" style="display: none;">
      <h2>Anúncios Cadastrados</h2>
      <div id="listaAnuncios"></div>
      <button class="btn btn-danger" onclick="showScreen('screenMenu')">Voltar ao Menu</button>
    </div>
  </div>

  <!-- CONTAINER DE VISUALIZAÇÃO EM REALIDADE AUMENTADA -->
  <div id="arView">
    <button class="close-ar" onclick="fecharAR()">X Sair da Câmera</button>
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-assets>
        <img id="arImgAsset" src="">
      </a-assets>

      <!-- Usa o marcador padrão HIRO (pode ser o QR Code colado na parede) -->
      <a-marker preset="hiro">
        <a-image 
          id="arImageEntity" 
          src="#arImgAsset" 
          position="0 0.5 0" 
          rotation="-90 0 0" 
          width="2" 
          height="1">
        </a-image>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </div>

  <script>
    let anuncios = JSON.parse(localStorage.getItem('ar_anuncios') || '[]');

    function showScreen(screenId) {
      document.getElementById('screenMenu').style.display = 'none';
      document.getElementById('screenCadastro').style.display = 'none';
      document.getElementById('screenLista').style.display = 'none';
      document.getElementById(screenId).style.display = 'block';

      if (screenId === 'screenLista') {
        renderizarLista();
      }
    }

    function salvarAnuncio() {
      const name = document.getElementById('adName').value;
      const imageUrl = document.getElementById('adImageUrl').value;
      const width = document.getElementById('adWidth').value || 2;
      const height = document.getElementById('adHeight').value || 1;

      if (!name || !imageUrl) {
        alert('Por favor, preencha o nome e a URL da imagem!');
        return;
      }

      const novoAnuncio = {
        id: Date.now(),
        name,
        imageUrl,
        width,
        height
      };

      anuncios.push(novoAnuncio);
      localStorage.setItem('ar_anuncios', JSON.stringify(anuncios));

      alert('Anúncio salvo com sucesso!');
      document.getElementById('adName').value = '';
      document.getElementById('adImageUrl').value = '';
      showScreen('screenMenu');
    }

    function renderizarLista() {
      const container = document.getElementById('listaAnuncios');
      container.innerHTML = '';

      if (anuncios.length === 0) {
        container.innerHTML = '<p style="text-align:center;">Nenhum anúncio cadastrado ainda.</p>';
        return;
      }

      anuncios.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        
        // Link gerado para abrir direto no leitor de AR deste anúncio
        const urlVisualizacao = `${window.location.origin}${window.location.pathname}?id=${item.id}`;

        card.innerHTML = `
          <h3>${item.name}</h3>
          <p>Tamanho: ${item.width}m x ${item.height}m</p>
          <div class="qr-container" id="qrcode-${index}"></div>
          <button class="btn" onclick="abrirCâmeraAR('${item.imageUrl}', ${item.width}, ${item.height})">
            Testar Câmera Agora
          </button>
        `;
        
        container.appendChild(card);

        // Gera o QR Code para colar no local
        new QRCode(document.getElementById(`qrcode-${index}`), {
          text: urlVisualizacao,
          width: 128,
          height: 128
        });
      });
    }

    function abrirCâmeraAR(imageUrl, width, height) {
      document.getElementById('uiContainer').style.display = 'none';
      document.getElementById('arView').style.display = 'block';

      const imgAsset = document.getElementById('arImgAsset');
      const imageEntity = document.getElementById('arImageEntity');

      imgAsset.setAttribute('src', imageUrl);
      imageEntity.setAttribute('width', width);
      imageEntity.setAttribute('height', height);
    }

    function fecharAR() {
      document.getElementById('arView').style.display = 'none';
      document.getElementById('uiContainer').style.display = 'block';
      showScreen('screenMenu');
    }

    // Verifica se a URL foi aberta via leitura de QR Code direto com um ID de anúncio
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const idParam = urlParams.get('id');

      if (idParam) {
        const item = anuncios.find(a => a.id == idParam);
        if (item) {
          abrirCâmeraAR(item.imageUrl, item.width, item.height);
        }
      }
    };
  </script>
</body>
</html>
